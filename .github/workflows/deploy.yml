name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Repository variable VITE_API_URL is required for deployment."
            exit 1
          fi
          node -e "const u = new URL(process.env.VITE_API_URL); if (u.protocol !== 'https:') { throw new Error('Deployment VITE_API_URL must use HTTPS.'); }"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run stylelint

      - name: Check formatting
        run: npm run prettier

      - name: Regression tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
